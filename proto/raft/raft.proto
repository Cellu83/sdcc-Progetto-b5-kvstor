syntax = "proto3";

package raft;

option go_package = "github.com/Cellu83/sdcc-Progetto-b5-kvstor/proto/raft;raftpb";

// OpType identifica il tipo di operazione applicativa contenuta in una entry
// di log (specchio di kvstore.OpType in Go).
enum OpType {
  OP_PUT = 0;
  OP_DELETE = 1;
}

// Command è l'operazione applicativa replicata via Raft (specchio di
// kvstore.Command in Go).
message Command {
  OpType op = 1;
  string key = 2;
  string value = 3;
}

// LogEntry è una singola entry del log replicato (specchio di
// raftlog.Entry in Go).
message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  Command command = 3;
}

// RequestVoteRequest è l'argomento della RPC RequestVote (Raft paper,
// Figure 2): usata da un candidato per chiedere il voto agli altri nodi.
message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

// AppendEntriesRequest è l'argomento della RPC AppendEntries (Raft paper,
// Figure 2): usata dal leader sia per gli heartbeat periodici (entries
// vuoto) sia per la replica vera e propria del log.
message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
}

// GetStatusRequest non porta parametri: chiede semplicemente "qual è la tua
// vista del cluster in questo momento?".
message GetStatusRequest {}

// PeerInfo identifica un nodo del cluster raggiungibile via gRPC.
message PeerInfo {
  string id = 1;
  string address = 2;
}

// GetStatusResponse è la vista del cluster secondo il nodo interrogato:
// chi crede sia l'attuale Leader (vuoto se non lo sa) e quali peer conosce.
// È il messaggio alla base del pattern Service Discovery: un client (es. il
// Client proxy service) la usa per scoprire dinamicamente dove indirizzare
// le richieste, invece di avere indirizzi fissi nel codice.
message GetStatusResponse {
  string node_id = 1;
  string leader_id = 2;
  repeated PeerInfo peers = 3;
}

// KeyValue è una singola coppia chiave-valore dentro uno snapshot.
message KeyValue {
  string key = 1;
  string value = 2;
}

// GetSnapshotRequest non porta parametri: chiede "dammi lo stato corrente
// della tua state machine".
message GetSnapshotRequest {}

// GetSnapshotResponse è un'istantanea completa della state machine
// chiave-valore del nodo interrogato, insieme ai metadati che indicano fino
// a quale entry di log quello stato è aggiornato. Usata dallo Snapshot &
// backup service per costruire un checkpoint esterno: il nodo non modifica
// in alcun modo il proprio log per effetto di questa chiamata.
message GetSnapshotResponse {
  uint64 last_included_index = 1;
  uint64 last_included_term = 2;
  repeated KeyValue data = 3;
}

// RaftService raccoglie le RPC di coordinamento del consenso scambiate tra
// i consensus node del cluster, più due RPC di sola lettura: GetStatus per
// la Service Discovery lato client, GetSnapshot per lo Snapshot & backup
// service.
service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
}
