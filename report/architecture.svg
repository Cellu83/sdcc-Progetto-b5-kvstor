<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="black"/>
    </marker>
  </defs>

  <!-- Client -->
  <rect x="20" y="120" width="90" height="40" rx="6" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="65" y="144" font-size="12" text-anchor="middle" fill="black">Client</text>

  <!-- Proxy -->
  <rect x="170" y="105" width="140" height="70" rx="6" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="240" y="128" font-size="12" text-anchor="middle" fill="black">Client Proxy</text>
  <text x="240" y="144" font-size="9" text-anchor="middle" fill="#333333">(Service Discovery +</text>
  <text x="240" y="156" font-size="9" text-anchor="middle" fill="#333333">Circuit Breaker)</text>

  <!-- Snapshot -->
  <rect x="10" y="215" width="140" height="62" rx="6" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="80" y="235" font-size="12" text-anchor="middle" fill="black">Snapshot &amp; Backup</text>
  <text x="80" y="250" font-size="9" text-anchor="middle" fill="#333333">(Service Discovery,</text>
  <text x="80" y="262" font-size="9" text-anchor="middle" fill="#333333">preferisce il Leader)</text>

  <!-- Consensus nodes -->
  <rect x="470" y="30" width="120" height="40" rx="6" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="530" y="54" font-size="12" text-anchor="middle" fill="black">node1</text>

  <rect x="470" y="140" width="120" height="40" rx="6" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="530" y="160" font-size="12" text-anchor="middle" fill="black">node2</text>
  <text x="530" y="172" font-size="9" text-anchor="middle" fill="#333333">(Leader)</text>

  <rect x="470" y="250" width="120" height="40" rx="6" fill="white" stroke="black" stroke-width="1.2"/>
  <text x="530" y="274" font-size="12" text-anchor="middle" fill="black">node3</text>

  <!-- Client -> Proxy -->
  <line x1="110" y1="140" x2="166" y2="140" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="97" y="124" width="82" height="12" fill="white"/>
  <text x="138" y="132" font-size="9" text-anchor="middle" fill="black">Get/Put/Delete</text>

  <!-- Proxy -> node2 (leader) -->
  <line x1="310" y1="150" x2="466" y2="158" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="337" y="137" width="102" height="12" fill="white"/>
  <text x="388" y="145" font-size="9" text-anchor="middle" fill="black">instrada al Leader</text>

  <!-- Proxy -> node1 (dashed, discovery) -->
  <line x1="310" y1="125" x2="466" y2="60" stroke="black" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="372" y="75" width="56" height="12" fill="white"/>
  <text x="400" y="83" font-size="9" text-anchor="middle" fill="black">GetStatus</text>

  <!-- Proxy -> node3 (dashed, discovery) -->
  <line x1="310" y1="168" x2="466" y2="255" stroke="black" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="372" y="220" width="56" height="12" fill="white"/>
  <text x="400" y="228" font-size="9" text-anchor="middle" fill="black">GetStatus</text>

  <!-- node2 -> node1 (AppendEntries) -->
  <line x1="560" y1="140" x2="560" y2="72" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="571" y="98" width="76" height="12" fill="white"/>
  <text x="608" y="106" font-size="9" text-anchor="middle" fill="black">AppendEntries</text>

  <!-- node2 -> node3 (AppendEntries) -->
  <line x1="560" y1="180" x2="560" y2="248" stroke="black" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="571" y="208" width="76" height="12" fill="white"/>
  <text x="608" y="216" font-size="9" text-anchor="middle" fill="black">AppendEntries</text>

  <!-- Snapshot -> node2 (dashed, GetSnapshot; preferisce il Leader ma via
       Service Discovery puo' raggiungere un nodo qualsiasi raggiungibile) -->
  <line x1="150" y1="246" x2="466" y2="168" stroke="black" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="266" y="213" width="68" height="12" fill="white"/>
  <text x="300" y="221" font-size="9" text-anchor="middle" fill="black">GetSnapshot</text>
</svg>
