proxy:
  bind_address: "0.0.0.0"
  port: 50060

cluster:
  peers:
    - id: "node1"
      address: "node1:50051"
    - id: "node2"
      address: "node2:50052"
    - id: "node3"
      address: "node3:50053"
    - id: "node4"
      address: "node4:50054"
    - id: "node5"
      address: "node5:50055"

rpc:
  timeout_ms: 300
  max_retries: 6
  retry_backoff_ms: 50

circuit_breaker:
  failure_threshold: 2
  reset_timeout_ms: 500

log_level: "info"
