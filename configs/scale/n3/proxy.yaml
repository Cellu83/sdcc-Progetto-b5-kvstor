proxy:
    bind_address: 0.0.0.0
    port: 51000
cluster:
    peers:
        - id: node1
          address: localhost:51001
        - id: node2
          address: localhost:51002
        - id: node3
          address: localhost:51003
rpc:
    timeout_ms: 300
    max_retries: 6
    retry_backoff_ms: 50
circuit_breaker:
    failure_threshold: 2
    reset_timeout_ms: 500
log_level: info
